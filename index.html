<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>動画で紹介した韓国コスメ</title>
<style>
:root{--bg:#fff7f9;--card:#fff;--ink:#3a2e33;--sub:#8a7a80;--pink:#ff5c8d;--line:#f1dfe5;--rk:#bf0000;--qt:#ff3a6e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
header{text-align:center;padding:8px 0 4px}h1{font-size:20px;margin:4px 0}.acct{color:var(--sub);font-size:13px;margin:0}
.pr{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--sub);margin:12px 0}
.pr b{color:var(--pink)}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:999px;font-size:15px;background:#fff;margin-bottom:12px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.head{display:flex;gap:8px;align-items:center;font-size:12px}.no{background:var(--pink);color:#fff;border-radius:999px;padding:2px 10px;font-weight:700}
.date{color:var(--sub)}h2{font-size:16px;margin:8px 0}ul{list-style:none;margin:0;padding:0}
.item{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item img,.noimg{width:76px;height:76px;object-fit:contain;border-radius:10px;background:#faf3f5;flex:none}
.info{flex:1;min-width:0}.name{margin:0 0 8px;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btn{flex:1;min-width:110px;text-align:center;text-decoration:none;color:#fff;font-size:13px;font-weight:700;padding:9px 6px;border-radius:999px}
.rk{background:var(--rk)}.qt{background:var(--qt)}
.empty,footer{text-align:center;color:var(--sub);font-size:12px}footer{padding:12px 0 24px}
</style></head>
<body><main>
<header><h1>動画で紹介した韓国コスメ</h1><p class="acct">@ssaammuu8</p></header>
<input id="q" type="search" placeholder="商品名・動画で探す" aria-label="検索">
<p class="empty">紹介した商品はまだありません。</p>
<footer>※価格・在庫・ポイントは各ショップのページでご確認ください<br>最終更新 2026/10/27 01:52</footer>
</main>
<script>
document.getElementById('q').addEventListener('input',function(e){var q=e.target.value.trim().toLowerCase();
document.querySelectorAll('.card').forEach(function(c){c.style.display=!q||c.dataset.text.toLowerCase().indexOf(q)>=0?'':'none'})});
</script>
</body></html>
